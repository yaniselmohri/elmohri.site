site_name: Yanis EL MOHRI
site_url: https://elmohri.site

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: blue
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/toggle-switch-off-outline
        name: Mode sombre
    - scheme: slate
      primary: black
      accent: cyan
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/toggle-switch
        name: Mode clair
  font:
    text: Roboto Mono

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - À propos: index.md
  - CV: cv.md
  - Projets: projects.md
  - Liens: contact.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yaniselmohri
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/elmohri/
    - icon: fontawesome/solid/gitlab
      link: https://code.up8.edu/elmohri/